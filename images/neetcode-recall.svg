<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" style="background:#0e1117;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="50%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2230"/>
      <stop offset="100%" stop-color="#121720"/>
    </linearGradient>
    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="timer-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="85%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1440" height="960" fill="url(#bg-grad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="120" x2="1440" y2="120"/>
    <line x1="0" y1="240" x2="1440" y2="240"/>
    <line x1="0" y1="360" x2="1440" y2="360"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="720" x2="1440" y2="720"/>
    <line x1="0" y1="840" x2="1440" y2="840"/>
    <line x1="160" y1="0" x2="160" y2="960"/>
    <line x1="320" y1="0" x2="320" y2="960"/>
    <line x1="480" y1="0" x2="480" y2="960"/>
    <line x1="640" y1="0" x2="640" y2="960"/>
    <line x1="800" y1="0" x2="800" y2="960"/>
    <line x1="960" y1="0" x2="960" y2="960"/>
    <line x1="1120" y1="0" x2="1120" y2="960"/>
    <line x1="1280" y1="0" x2="1280" y2="960"/>
  </g>

  <!-- Window Container -->
  <g transform="translate(140, 80)" filter="url(#card-shadow)">
    <!-- Main Window Background -->
    <rect width="1160" height="800" rx="16" fill="#131822" stroke="#252f40" stroke-width="1.5"/>

    <!-- Title Bar -->
    <rect width="1160" height="64" rx="16" fill="#18202d"/>
    <rect y="48" width="1160" height="16" fill="#18202d"/>
    <line x1="0" y1="64" x2="1160" y2="64" stroke="#252f40" stroke-width="1"/>

    <!-- Window Buttons -->
    <circle cx="36" cy="32" r="6.5" fill="#ff5f56"/>
    <circle cx="58" cy="32" r="6.5" fill="#ffbd2e"/>
    <circle cx="80" cy="32" r="6.5" fill="#27c93f"/>

    <!-- URL / App Badge -->
    <g transform="translate(130, 16)">
      <rect width="420" height="32" rx="8" fill="#0f141d" stroke="#2a3548" stroke-width="1"/>
      <circle cx="20" cy="16" r="4" fill="#3b82f6"/>
      <text x="34" y="21" fill="#94a3b8" font-size="13" font-weight="500">neetcode.io/problems/search-in-rotated-sorted-array</text>
    </g>

    <!-- Extension Live Status Indicator -->
    <g transform="translate(930, 18)">
      <rect width="190" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#10b981"/>
      <text x="28" y="19" fill="#e2e8f0" font-size="12" font-weight="600">Recall Loop Active</text>
    </g>

    <!-- Content Grid: Left NeetCode Canvas (680px), Right Extension Popup (410px) -->
    <!-- Left Column: NeetCode Problem Canvas -->
    <g transform="translate(36, 92)">
      <!-- Problem Header -->
      <text x="0" y="28" fill="#ffffff" font-size="24" font-weight="700">33. Search in Rotated Sorted Array</text>
      <rect x="0" y="44" width="76" height="24" rx="12" fill="#eab308" fill-opacity="0.18"/>
      <text x="38" y="60" fill="#facc15" font-size="12" font-weight="600" text-anchor="middle">Medium</text>

      <rect x="88" y="44" width="112" height="24" rx="12" fill="#1e293b"/>
      <text x="144" y="60" fill="#94a3b8" font-size="12" font-weight="500" text-anchor="middle">Binary Search</text>

      <!-- Problem Prompt Box -->
      <rect x="0" y="88" width="670" height="210" rx="12" fill="#171e2b" stroke="#252f40" stroke-width="1"/>
      <text x="24" y="122" fill="#cbd5e1" font-size="14" line-height="24">Given the array <tspan fill="#60a5fa" font-family="monospace">nums</tspan> after the possible rotation and an integer <tspan fill="#60a5fa" font-family="monospace">target</tspan>,</text>
      <text x="24" y="150" fill="#cbd5e1" font-size="14">return the index of <tspan fill="#60a5fa" font-family="monospace">target</tspan> if it is in <tspan fill="#60a5fa" font-family="monospace">nums</tspan>, or <tspan fill="#f87171" font-family="monospace">-1</tspan> if it is not in nums.</text>
      <text x="24" y="186" fill="#94a3b8" font-size="13">You must write an algorithm with <tspan fill="#34d399" font-family="monospace">O(log n)</tspan> runtime complexity.</text>

      <!-- Code Editor Mockup -->
      <g transform="translate(0, 320)">
        <rect width="670" height="340" rx="12" fill="#0d1117" stroke="#252f40" stroke-width="1"/>
        <!-- Tab Bar -->
        <rect width="670" height="36" rx="12" fill="#161b22"/>
        <rect y="24" width="670" height="12" fill="#161b22"/>
        <text x="20" y="24" fill="#58a6ff" font-size="12" font-family="monospace">solution.py</text>

        <!-- Code lines -->
        <text x="24" y="70" fill="#ff7b72" font-family="monospace" font-size="13">class <tspan fill="#ffa657">Solution</tspan>:</text>
        <text x="48" y="96" fill="#ff7b72" font-family="monospace" font-size="13">def <tspan fill="#d2a8ff">search</tspan><tspan fill="#c9d1d9">(self, nums: List[int], target: int) -> int:</tspan></text>
        <text x="72" y="122" fill="#c9d1d9" font-family="monospace" font-size="13">left, right = 0, len(nums) - 1</text>
        <text x="72" y="148" fill="#ff7b72" font-family="monospace" font-size="13">while <tspan fill="#c9d1d9">left &lt;= right:</tspan></text>
        <text x="96" y="174" fill="#c9d1d9" font-family="monospace" font-size="13">mid = (left + right) // 2</text>
        <text x="96" y="200" fill="#ff7b72" font-family="monospace" font-size="13">if <tspan fill="#c9d1d9">nums[mid] == target: </tspan><tspan fill="#ff7b72">return </tspan><tspan fill="#79c0ff">mid</tspan></text>
        <text x="96" y="226" fill="#8b949e" font-family="monospace" font-size="13"># Determine which side is uniformly sorted</text>
        <text x="96" y="252" fill="#ff7b72" font-family="monospace" font-size="13">if <tspan fill="#c9d1d9">nums[left] &lt;= nums[mid]:</tspan></text>
        <text x="120" y="278" fill="#8b949e" font-family="monospace" font-size="13">...</text>
      </g>
    </g>

    <!-- Right Column: Recall Loop Overlay Card -->
    <g transform="translate(736, 92)">
      <!-- Card Container -->
      <rect width="388" height="660" rx="14" fill="#182232" stroke="#3b82f6" stroke-width="1.8" filter="url(#card-shadow)"/>

      <!-- Extension Header -->
      <g transform="translate(24, 28)">
        <rect width="36" height="36" rx="8" fill="#2563eb"/>
        <!-- Loop Icon in Header -->
        <path d="M12 18 A6 6 0 1 1 24 22 L21 19 M24 22 L27 19" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
        <text x="48" y="18" fill="#ffffff" font-size="16" font-weight="700">Recall Loop</text>
        <text x="48" y="34" fill="#93c5fd" font-size="11" font-weight="500">NeetCode Spaced Repetition</text>
      </g>

      <!-- Active Timer Widget -->
      <g transform="translate(24, 88)">
        <rect width="340" height="106" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="18" y="28" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.08em">ATTEMPT TIMER (MEDIUM INTERVAL)</text>
        <text x="18" y="62" fill="#ffffff" font-size="28" font-family="monospace" font-weight="700">18:42 <tspan fill="#475569" font-size="16">/ 25:00</tspan></text>
        
        <!-- Progress Bar -->
        <rect x="18" y="78" width="304" height="8" rx="4" fill="#1e293b"/>
        <rect x="18" y="78" width="228" height="8" rx="4" fill="url(#timer-bar)"/>
      </g>

      <!-- Active Recall Prompt Card -->
      <g transform="translate(24, 212)">
        <rect width="340" height="136" rx="10" fill="#132035" stroke="#1d4ed8" stroke-width="1"/>
        <circle cx="28" cy="28" r="8" fill="#3b82f6" fill-opacity="0.2"/>
        <circle cx="28" cy="28" r="4" fill="#60a5fa"/>
        <text x="44" y="32" fill="#93c5fd" font-size="12" font-weight="700">ACTIVE RECALL CHECK</text>
        <text x="20" y="62" fill="#e2e8f0" font-size="13" font-weight="500">Before viewing solution, identify:</text>
        <text x="28" y="86" fill="#cbd5e1" font-size="12">✓ How does pivot split monotonicity?</text>
        <text x="28" y="108" fill="#cbd5e1" font-size="12">✓ Binary search boundary condition</text>
      </g>

      <!-- Pattern Transfer Suggestions -->
      <g transform="translate(24, 366)">
        <text x="0" y="16" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.08em">RECOMMENDED PATTERN NEIGHBORS</text>
        
        <!-- Neighbor 1 -->
        <g transform="translate(0, 30)">
          <rect width="340" height="54" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
          <text x="16" y="24" fill="#f1f5f9" font-size="12" font-weight="600">Find Minimum in Rotated Array</text>
          <text x="16" y="42" fill="#38bdf8" font-size="11">Binary Search · 94% Pattern Match</text>
          <text x="312" y="32" fill="#64748b" font-size="14">→</text>
        </g>

        <!-- Neighbor 2 -->
        <g transform="translate(0, 94)">
          <rect width="340" height="54" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
          <text x="16" y="24" fill="#f1f5f9" font-size="12" font-weight="600">Search in Rotated Sorted Array II</text>
          <text x="16" y="42" fill="#38bdf8" font-size="11">Duplicates Edge Case · Transfer Challenge</text>
          <text x="312" y="32" fill="#64748b" font-size="14">→</text>
        </g>
      </g>

      <!-- Bottom Privacy Pill -->
      <g transform="translate(24, 584)">
        <rect width="340" height="42" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
        <circle cx="20" cy="21" r="5" fill="#10b981"/>
        <text x="34" y="25" fill="#9ca3af" font-size="11">100% Local Storage · Zero telemetry or data egress</text>
      </g>
    </g>
  </g>
</svg>
