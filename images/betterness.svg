<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" style="background:#0c1017;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <linearGradient id="bn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="50%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="phone-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="card-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222d42"/>
      <stop offset="100%" stop-color="#182030"/>
    </linearGradient>
    <linearGradient id="streak-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="mood-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="phone-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="960" fill="url(#bn-bg)"/>

  <!-- Subtle ambient glow in center -->
  <circle cx="720" cy="480" r="380" fill="url(#phone-glow)"/>

  <!-- Background grid lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="160" x2="1440" y2="160"/>
    <line x1="0" y1="320" x2="1440" y2="320"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
    <line x1="0" y1="640" x2="1440" y2="640"/>
    <line x1="0" y1="800" x2="1440" y2="800"/>
    <line x1="240" y1="0" x2="240" y2="960"/>
    <line x1="480" y1="0" x2="480" y2="960"/>
    <line x1="720" y1="0" x2="720" y2="960"/>
    <line x1="960" y1="0" x2="960" y2="960"/>
    <line x1="1200" y1="0" x2="1200" y2="960"/>
  </g>

  <!-- Left Sidebar Feature Card: iOS Architecture -->
  <g transform="translate(130, 240)">
    <rect width="320" height="480" rx="16" fill="#131a26" stroke="#233044" stroke-width="1.2" filter="url(#phone-shadow)"/>
    
    <g transform="translate(24, 28)">
      <rect width="36" height="36" rx="8" fill="#4f46e5"/>
      <!-- Swift bird logo silhouette -->
      <path d="M12 24 C14 21, 18 19, 24 16 C21 18, 17 21, 16 25 C20 22, 23 20, 26 19 C23 23, 18 26, 14 27 Z" fill="#ffffff"/>
      <text x="48" y="18" fill="#ffffff" font-size="15" font-weight="700">SwiftUI App</text>
      <text x="48" y="34" fill="#94a3b8" font-size="11">Native iOS 17 Architecture</text>
    </g>

    <!-- Architecture details -->
    <g transform="translate(24, 88)">
      <rect width="272" height="68" rx="8" fill="#0d121b" stroke="#1d2636" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.06em">STATE MANAGEMENT</text>
      <text x="14" y="46" fill="#f1f5f9" font-size="12" font-weight="600">@Observable &amp; SwiftData</text>
      <text x="14" y="60" fill="#94a3b8" font-size="11">Zero third-party bloat · Fluid 120Hz</text>
    </g>

    <g transform="translate(24, 168)">
      <rect width="272" height="68" rx="8" fill="#0d121b" stroke="#1d2636" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.06em">CORE FEATURE</text>
      <text x="14" y="46" fill="#f1f5f9" font-size="12" font-weight="600">Habit Streaks &amp; Logs</text>
      <text x="14" y="60" fill="#94a3b8" font-size="11">Interactive daily completion rings</text>
    </g>

    <g transform="translate(24, 248)">
      <rect width="272" height="68" rx="8" fill="#0d121b" stroke="#1d2636" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.06em">MENTAL WELLNESS</text>
      <text x="14" y="46" fill="#f1f5f9" font-size="12" font-weight="600">Mood Tracking &amp; Journal</text>
      <text x="14" y="60" fill="#94a3b8" font-size="11">Encrypted on-device storage</text>
    </g>

    <g transform="translate(24, 332)">
      <rect width="272" height="116" rx="8" fill="#0d121b" stroke="#1d2636" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.06em">TECH STACK</text>
      <text x="14" y="46" fill="#38bdf8" font-size="12" font-weight="600">Swift 5.9 · SwiftUI · Combine</text>
      <text x="14" y="68" fill="#94a3b8" font-size="11">XCTest UI Tests · SF Symbols</text>
      <text x="14" y="94" fill="#10b981" font-size="11" font-weight="600">✓ Tested on iPhone 15 Pro / iOS 17</text>
    </g>
  </g>

  <!-- Right Sidebar Feature Card: Performance / Stats -->
  <g transform="translate(990, 240)">
    <rect width="320" height="480" rx="16" fill="#131a26" stroke="#233044" stroke-width="1.2" filter="url(#phone-shadow)"/>
    
    <g transform="translate(24, 28)">
      <text x="0" y="16" fill="#ffffff" font-size="16" font-weight="700">Daily Insight Engine</text>
      <text x="0" y="34" fill="#94a3b8" font-size="12">Self-Improvement Telemetry</text>
    </g>

    <!-- Streak Card -->
    <g transform="translate(24, 76)">
      <rect width="272" height="106" rx="10" fill="#0d121b" stroke="#1d2636" stroke-width="1"/>
      <text x="16" y="26" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.06em">CURRENT HABIT STREAK</text>
      <text x="16" y="64" fill="#f59e0b" font-size="34" font-weight="800">14 <tspan fill="#fbbf24" font-size="20">DAYS 🔥</tspan></text>
      <!-- Progress Bar -->
      <rect x="16" y="82" width="240" height="6" rx="3" fill="#1e293b"/>
      <rect x="16" y="82" width="200" height="6" rx="3" fill="url(#streak-grad)"/>
    </g>

    <!-- Weekly Mood Graph -->
    <g transform="translate(24, 200)">
      <rect width="272" height="140" rx="10" fill="#0d121b" stroke="#1d2636" stroke-width="1"/>
      <text x="16" y="24" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.06em">WEEKLY MOOD CURVE</text>
      <path d="M 24 95 Q 60 70, 95 85 T 160 50 T 225 65 T 255 45" fill="none" stroke="url(#mood-grad)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="255" cy="45" r="4" fill="#ec4899"/>
      <text x="16" y="124" fill="#94a3b8" font-size="11">Avg: <tspan fill="#a78bfa" font-weight="600">Energized &amp; Productive</tspan></text>
    </g>

    <!-- Privacy Banner -->
    <g transform="translate(24, 358)">
      <rect width="272" height="90" rx="10" fill="#0d121b" stroke="#1d2636" stroke-width="1"/>
      <text x="16" y="26" fill="#10b981" font-size="12" font-weight="700">🔒 100% Private</text>
      <text x="16" y="50" fill="#cbd5e1" font-size="11" line-height="16">All journals, habits, and mood telemetry stay strictly on the user's device.</text>
      <text x="16" y="74" fill="#64748b" font-size="10">No remote database or account needed.</text>
    </g>
  </g>

  <!-- Center iPhone 15 Pro Frame -->
  <g transform="translate(520, 50)" filter="url(#phone-shadow)">
    <!-- Outer iPhone Bezel (400 x 860) -->
    <rect width="400" height="860" rx="54" fill="#1e2433" stroke="#374151" stroke-width="3.5"/>
    <!-- Inner Screen Bezel -->
    <rect x="8" y="8" width="384" height="844" rx="46" fill="#000000"/>
    <!-- Screen Viewport Background -->
    <rect x="12" y="12" width="376" height="836" rx="42" fill="#0d1117"/>

    <!-- Dynamic Island Pill -->
    <g transform="translate(142, 22)">
      <rect width="116" height="30" rx="15" fill="#000000"/>
      <!-- Camera dot -->
      <circle cx="95" cy="15" r="5" fill="#111827"/>
      <circle cx="95" cy="15" r="2" fill="#1f2937"/>
    </g>

    <!-- iOS Status Bar -->
    <text x="44" y="42" fill="#ffffff" font-size="13" font-weight="600">9:41</text>
    <!-- Battery & WiFi -->
    <g transform="translate(320, 32)">
      <rect x="8" y="1" width="22" height="11" rx="3" fill="none" stroke="#ffffff" stroke-width="1.2"/>
      <rect x="10" y="3" width="16" height="7" rx="1.5" fill="#ffffff"/>
      <path d="M31 4.5 C31.5 5, 31.5 8, 31 8.5" stroke="#ffffff" stroke-width="1.2" fill="none"/>
    </g>

    <!-- App Content Inside Phone -->
    <g transform="translate(32, 80)">
      <!-- Top Greetings -->
      <text x="0" y="16" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.04em">SUNDAY, SEPTEMBER 20</text>
      <text x="0" y="44" fill="#ffffff" font-size="26" font-weight="800">Betterness<tspan fill="#6366f1">.</tspan></text>
      
      <!-- Mood Check-in Card -->
      <g transform="translate(0, 64)">
        <rect width="336" height="106" rx="16" fill="url(#card-grad1)" stroke="#2b3952" stroke-width="1"/>
        <text x="18" y="26" fill="#cbd5e1" font-size="13" font-weight="600">How are you feeling today?</text>
        
        <!-- Mood options row -->
        <g transform="translate(18, 42)">
          <rect x="0" y="0" width="62" height="48" rx="10" fill="#1e293b"/>
          <text x="31" y="24" font-size="18" text-anchor="middle">⚡️</text>
          <text x="31" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">Energized</text>

          <rect x="74" y="0" width="68" height="48" rx="10" fill="#4f46e5"/>
          <text x="108" y="24" font-size="18" text-anchor="middle">🎯</text>
          <text x="108" y="40" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">Focused</text>

          <rect x="154" y="0" width="62" height="48" rx="10" fill="#1e293b"/>
          <text x="185" y="24" font-size="18" text-anchor="middle">🧘</text>
          <text x="185" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">Calm</text>

          <rect x="228" y="0" width="62" height="48" rx="10" fill="#1e293b"/>
          <text x="259" y="24" font-size="18" text-anchor="middle">😴</text>
          <text x="259" y="40" fill="#94a3b8" font-size="9" text-anchor="middle">Tired</text>
        </g>
      </g>

      <!-- Today's Habits Section -->
      <g transform="translate(0, 192)">
        <text x="0" y="16" fill="#ffffff" font-size="16" font-weight="700">Today's Habits</text>
        <text x="278" y="16" fill="#818cf8" font-size="12" font-weight="600">3 of 4</text>

        <!-- Habit 1: Completed -->
        <g transform="translate(0, 30)">
          <rect width="336" height="56" rx="12" fill="#141c28" stroke="#1f293d" stroke-width="1"/>
          <circle cx="28" cy="28" r="14" fill="#10b981"/>
          <path d="M22 28 L26 32 L34 24" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <text x="52" y="27" fill="#f8fafc" font-size="13" font-weight="600">Morning Code Review</text>
          <text x="52" y="43" fill="#64748b" font-size="11">45 mins completed</text>
          <rect x="264" y="18" width="56" height="20" rx="6" fill="#065f46"/>
          <text x="292" y="32" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">STREAK 14</text>
        </g>

        <!-- Habit 2: Completed -->
        <g transform="translate(0, 96)">
          <rect width="336" height="56" rx="12" fill="#141c28" stroke="#1f293d" stroke-width="1"/>
          <circle cx="28" cy="28" r="14" fill="#10b981"/>
          <path d="M22 28 L26 32 L34 24" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <text x="52" y="27" fill="#f8fafc" font-size="13" font-weight="600">Robotics Lab Session</text>
          <text x="52" y="43" fill="#64748b" font-size="11">Autonomous Path Planning</text>
          <rect x="264" y="18" width="56" height="20" rx="6" fill="#065f46"/>
          <text x="292" y="32" fill="#34d399" font-size="10" font-weight="700" text-anchor="middle">STREAK 8</text>
        </g>

        <!-- Habit 3: In Progress / Open -->
        <g transform="translate(0, 162)">
          <rect width="336" height="56" rx="12" fill="#141c28" stroke="#3b82f6" stroke-width="1.2"/>
          <circle cx="28" cy="28" r="14" fill="none" stroke="#60a5fa" stroke-width="2"/>
          <text x="52" y="27" fill="#f8fafc" font-size="13" font-weight="600">Evening Reflection &amp; Read</text>
          <text x="52" y="43" fill="#93c5fd" font-size="11">Next up at 9:00 PM</text>
          <text x="306" y="33" fill="#60a5fa" font-size="18" text-anchor="middle">○</text>
        </g>
      </g>

      <!-- Daily Journal Preview Card -->
      <g transform="translate(0, 432)">
        <text x="0" y="16" fill="#ffffff" font-size="16" font-weight="700">Quick Journal</text>
        
        <rect y="28" width="336" height="110" rx="14" fill="url(#card-grad1)" stroke="#2b3952" stroke-width="1"/>
        <text x="18" y="56" fill="#e2e8f0" font-size="12" font-weight="600">"Got both FRC teleop and autonomous working."</text>
        <text x="18" y="78" fill="#94a3b8" font-size="11" line-height="16">Spent the afternoon fine-tuning PID constants. The difference between theory and practice is what makes robotics fun.</text>
        <text x="18" y="122" fill="#64748b" font-size="10">Saved to Local Device · 4:18 PM</text>
      </g>
    </g>

    <!-- Bottom iOS Tab Bar -->
    <g transform="translate(12, 756)">
      <rect width="376" height="80" rx="20" fill="#111622" stroke="#1f2937" stroke-width="1"/>
      
      <!-- Tab 1: Today (Active) -->
      <g transform="translate(48, 20)">
        <circle cx="16" cy="14" r="8" fill="#6366f1" fill-opacity="0.2"/>
        <circle cx="16" cy="14" r="4" fill="#818cf8"/>
        <text x="16" y="34" fill="#818cf8" font-size="10" font-weight="700" text-anchor="middle">Today</text>
      </g>

      <!-- Tab 2: Habits -->
      <g transform="translate(138, 20)">
        <circle cx="16" cy="14" r="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
        <text x="16" y="34" fill="#64748b" font-size="10" font-weight="500" text-anchor="middle">Habits</text>
      </g>

      <!-- Tab 3: Journal -->
      <g transform="translate(228, 20)">
        <rect x="9" y="8" width="14" height="13" rx="2" fill="none" stroke="#64748b" stroke-width="1.5"/>
        <text x="16" y="34" fill="#64748b" font-size="10" font-weight="500" text-anchor="middle">Journal</text>
      </g>

      <!-- Tab 4: Insights -->
      <g transform="translate(310, 20)">
        <path d="M10 18 L14 12 L18 15 L23 9" fill="none" stroke="#64748b" stroke-width="1.5"/>
        <text x="16" y="34" fill="#64748b" font-size="10" font-weight="500" text-anchor="middle">Insights</text>
      </g>

      <!-- Home Indicator bar -->
      <rect x="118" y="60" width="140" height="4" rx="2" fill="#ffffff" fill-opacity="0.5"/>
    </g>
  </g>
</svg>
