<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" style="background:#090d14;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <linearGradient id="pc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d15"/>
      <stop offset="50%" stop-color="#0f1624"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </linearGradient>
    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="pc-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1440" height="960" fill="url(#pc-bg)"/>

  <!-- Subtle engineering grid lines -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="160" x2="1440" y2="160"/>
    <line x1="0" y1="320" x2="1440" y2="320"/>
    <line x1="0" y1="480" x2="1440" y2="480"/>
    <line x1="0" y1="640" x2="1440" y2="640"/>
    <line x1="0" y1="800" x2="1440" y2="800"/>
    <line x1="240" y1="0" x2="240" y2="960"/>
    <line x1="480" y1="0" x2="480" y2="960"/>
    <line x1="720" y1="0" x2="720" y2="960"/>
    <line x1="960" y1="0" x2="960" y2="960"/>
    <line x1="1200" y1="0" x2="1200" y2="960"/>
  </g>

  <!-- Main Window -->
  <g transform="translate(140, 70)" filter="url(#pc-shadow)">
    <rect width="1160" height="820" rx="16" fill="#111723" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Window Top Header -->
    <rect width="1160" height="60" rx="16" fill="#161f30"/>
    <rect y="44" width="1160" height="16" fill="#161f30"/>
    <line x1="0" y1="60" x2="1160" y2="60" stroke="#243044" stroke-width="1"/>

    <!-- macOS Traffic Buttons -->
    <circle cx="36" cy="30" r="6.5" fill="#ff5f56"/>
    <circle cx="58" cy="30" r="6.5" fill="#ffbd2e"/>
    <circle cx="80" cy="30" r="6.5" fill="#27c93f"/>

    <text x="114" y="35" fill="#e2e8f0" font-size="14" font-weight="600" font-family="monospace">PhotosClassifier.py — Automated Face Encoding &amp; Photo Routing</text>

    <!-- Top Stats Badges -->
    <g transform="translate(820, 16)">
      <rect width="310" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#10b981"/>
      <text x="28" y="18" fill="#94a3b8" font-size="11" font-weight="500">Pipeline: <tspan fill="#38bdf8" font-weight="700">50GB Dataset</tspan> · <tspan fill="#4ade80" font-weight="700">Multi-Face Batching</tspan></text>
    </g>

    <!-- Layout: Left Vision Viewport (700px), Right Classifier Dashboard (390px) -->
    <!-- Left: Computer Vision Detection Viewport -->
    <g transform="translate(36, 84)">
      <!-- Viewport Frame -->
      <rect width="690" height="420" rx="12" fill="#080c13" stroke="#243044" stroke-width="1"/>

      <!-- Crosshairs overlay -->
      <g stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1">
        <line x1="345" y1="0" x2="345" y2="420" stroke-dasharray="4 4"/>
        <line x1="0" y1="210" x2="690" y2="210" stroke-dasharray="4 4"/>
      </g>

      <!-- Viewport Camera/Image Header -->
      <text x="24" y="32" fill="#64748b" font-family="monospace" font-size="11">STREAM: /RoboticsPhotos/FRC_Districts_IMG_9482.RAW</text>
      <text x="560" y="32" fill="#10b981" font-family="monospace" font-size="11">DETECTION ACTIVE</text>

      <!-- Silhouette 1: Teammate Left -->
      <g transform="translate(90, 80)">
        <rect x="0" y="0" width="150" height="250" rx="10" fill="#1e293b" fill-opacity="0.4" stroke="#06b6d4" stroke-width="1.8"/>
        <!-- Face box -->
        <rect x="25" y="25" width="100" height="110" rx="6" fill="none" stroke="#06b6d4" stroke-width="2"/>
        <!-- Corner brackets -->
        <path d="M20 35 L20 20 L35 20 M110 20 L130 20 L130 35 M20 120 L20 140 L35 140 M110 140 L130 140 L130 120" stroke="#06b6d4" stroke-width="3" fill="none"/>
        <rect x="20" y="146" width="110" height="24" rx="4" fill="#0891b2"/>
        <text x="75" y="162" fill="#ffffff" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle">Teammate #2 [97.8%]</text>
      </g>

      <!-- Silhouette 2: Avi (Center Focus) -->
      <g transform="translate(270, 50)">
        <rect x="0" y="0" width="180" height="300" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#10b981" stroke-width="2.2"/>
        <!-- Face box -->
        <rect x="30" y="20" width="120" height="130" rx="6" fill="none" stroke="#10b981" stroke-width="2.5"/>
        <!-- Corner brackets -->
        <path d="M22 35 L22 14 L42 14 M138 14 L158 14 L158 35 M22 135 L22 156 L42 156 M138 156 L158 156 L158 135" stroke="#10b981" stroke-width="3" fill="none"/>
        <!-- 128-d encoding points -->
        <circle cx="65" cy="65" r="3" fill="#34d399"/>
        <circle cx="115" cy="65" r="3" fill="#34d399"/>
        <circle cx="90" cy="85" r="2.5" fill="#34d399"/>
        <circle cx="75" cy="110" r="2.5" fill="#34d399"/>
        <circle cx="105" cy="110" r="2.5" fill="#34d399"/>
        <rect x="20" y="162" width="140" height="26" rx="5" fill="#059669"/>
        <text x="90" y="179" fill="#ffffff" font-size="12" font-weight="700" font-family="monospace" text-anchor="middle">Avi [99.4% Match]</text>
        <text x="90" y="202" fill="#a7f3d0" font-size="10" font-family="monospace" text-anchor="middle">Embedding dist: 0.28</text>
      </g>

      <!-- Silhouette 3: Mentor/Pit Crew Right -->
      <g transform="translate(480, 90)">
        <rect x="0" y="0" width="140" height="230" rx="10" fill="#1e293b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="1.8"/>
        <!-- Face box -->
        <rect x="25" y="20" width="90" height="100" rx="6" fill="none" stroke="#f59e0b" stroke-width="2"/>
        <rect x="15" y="130" width="110" height="22" rx="4" fill="#d97706"/>
        <text x="70" y="145" fill="#ffffff" font-size="11" font-weight="700" font-family="monospace" text-anchor="middle">Drive Lead [96.5%]</text>
      </g>
    </g>

    <!-- Bottom: Live Execution Terminal Log -->
    <g transform="translate(36, 524)">
      <rect width="690" height="264" rx="12" fill="#0a0e17" stroke="#1e293b" stroke-width="1"/>
      <rect width="690" height="32" rx="12" fill="#131b2a"/>
      <rect y="20" width="690" height="12" fill="#131b2a"/>
      <text x="20" y="21" fill="#94a3b8" font-size="11" font-family="monospace">EXECUTION LOG — face_recognition + cv2</text>

      <text x="20" y="58" fill="#64748b" font-family="monospace" font-size="12">[01:14:02] <tspan fill="#38bdf8">INFO:</tspan> Loaded reference profile for 'Avi' (128-dimensional vector)</text>
      <text x="20" y="82" fill="#64748b" font-family="monospace" font-size="12">[01:14:05] <tspan fill="#38bdf8">INFO:</tspan> Scanning /Users/avi/Desktop/RoboticsPhotos (1,420 files, 48.6 GB)</text>
      <text x="20" y="106" fill="#64748b" font-family="monospace" font-size="12">[01:14:18] <tspan fill="#4ade80">MATCH:</tspan> IMG_4821.JPG -> face detected: Avi (euclidean dist = 0.284)</text>
      <text x="20" y="130" fill="#64748b" font-family="monospace" font-size="12">[01:14:19] <tspan fill="#e2e8f0">ROUTING:</tspan> Copied to /SortedPhotos/Avi/IMG_4821.JPG</text>
      <text x="20" y="154" fill="#64748b" font-family="monospace" font-size="12">[01:14:23] <tspan fill="#4ade80">MATCH:</tspan> IMG_4822.JPG -> face detected: Avi + Teammate #2</text>
      <text x="20" y="178" fill="#64748b" font-family="monospace" font-size="12">[01:14:30] <tspan fill="#a855f7">CLUSTER:</tspan> Automatically created folder: /SortedPhotos/GroupPhotos/</text>
      <text x="20" y="204" fill="#10b981" font-family="monospace" font-size="12">[STATUS] Batch complete: 1,420 photos sorted in 11.2s without manual tagging</text>
      <text x="20" y="234" fill="#38bdf8" font-family="monospace" font-size="12">avi@macbook-pro PhotosClassifier % <tspan fill="#ffffff">_</tspan></text>
    </g>

    <!-- Right: Classifier Control Panel -->
    <g transform="translate(750, 84)">
      <rect width="374" height="704" rx="12" fill="#131c2a" stroke="#243044" stroke-width="1.2"/>

      <!-- Panel Title -->
      <g transform="translate(24, 28)">
        <text x="0" y="16" fill="#ffffff" font-size="18" font-weight="700">Cluster &amp; Sort Engine</text>
        <text x="0" y="36" fill="#94a3b8" font-size="12">Autonomous Image Classification</text>
      </g>

      <!-- Key Metrics Cards -->
      <g transform="translate(24, 76)">
        <rect width="155" height="84" rx="8" fill="#0f1624" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="26" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.08em">VOLUME SORTED</text>
        <text x="14" y="58" fill="#38bdf8" font-size="24" font-weight="700">50.4 GB</text>
        <text x="14" y="74" fill="#94a3b8" font-size="10">Robotics Event Media</text>

        <rect x="171" width="155" height="84" rx="8" fill="#0f1624" stroke="#1e293b" stroke-width="1"/>
        <text x="185" y="26" fill="#64748b" font-size="10" font-weight="700" letter-spacing="0.08em">TOTAL PROCESSED</text>
        <text x="185" y="58" fill="#4ade80" font-size="24" font-weight="700">1,420</text>
        <text x="185" y="74" fill="#94a3b8" font-size="10">High-Res RAW &amp; JPEGs</text>
      </g>

      <!-- Output Directory Routing -->
      <g transform="translate(24, 184)">
        <text x="0" y="16" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.08em">AUTO-ORGANIZED DIRECTORIES</text>

        <!-- Folder 1 -->
        <g transform="translate(0, 30)">
          <rect width="326" height="58" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
          <!-- Folder Icon -->
          <path d="M16 20 L24 20 L28 24 L42 24 A2 2 0 0 1 44 26 L44 38 A2 2 0 0 1 42 40 L16 40 A2 2 0 0 1 14 38 L14 22 A2 2 0 0 1 16 20 Z" fill="#38bdf8"/>
          <text x="56" y="28" fill="#f1f5f9" font-size="13" font-weight="600">/SortedPhotos/Avi/</text>
          <text x="56" y="46" fill="#4ade80" font-size="11">418 photos matched · 99.4% avg conf</text>
        </g>

        <!-- Folder 2 -->
        <g transform="translate(0, 100)">
          <rect width="326" height="58" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
          <path d="M16 20 L24 20 L28 24 L42 24 A2 2 0 0 1 44 26 L44 38 A2 2 0 0 1 42 40 L16 40 A2 2 0 0 1 14 38 L14 22 A2 2 0 0 1 16 20 Z" fill="#06b6d4"/>
          <text x="56" y="28" fill="#f1f5f9" font-size="13" font-weight="600">/SortedPhotos/Team_Leads/</text>
          <text x="56" y="46" fill="#94a3b8" font-size="11">532 photos matched · 4 profiles</text>
        </g>

        <!-- Folder 3 -->
        <g transform="translate(0, 170)">
          <rect width="326" height="58" rx="8" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
          <path d="M16 20 L24 20 L28 24 L42 24 A2 2 0 0 1 44 26 L44 38 A2 2 0 0 1 42 40 L16 40 A2 2 0 0 1 14 38 L14 22 A2 2 0 0 1 16 20 Z" fill="#f59e0b"/>
          <text x="56" y="28" fill="#f1f5f9" font-size="13" font-weight="600">/SortedPhotos/Competition_Matches/</text>
          <text x="56" y="46" fill="#94a3b8" font-size="11">470 robot &amp; field action photos</text>
        </g>
      </g>

      <!-- Technical Stack Details -->
      <g transform="translate(24, 460)">
        <rect width="326" height="210" rx="10" fill="#0d131f" stroke="#1e293b" stroke-width="1"/>
        <text x="18" y="28" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.08em">ALGORITHM &amp; TECH SPEC</text>
        
        <text x="18" y="60" fill="#cbd5e1" font-size="12">Model: <tspan fill="#38bdf8" font-weight="600">dlib ResNet Face Recognizer</tspan></text>
        <text x="18" y="86" fill="#cbd5e1" font-size="12">Embedding: <tspan fill="#ffffff" font-family="monospace">128-D Euclidean Vector Space</tspan></text>
        <text x="18" y="112" fill="#cbd5e1" font-size="12">Threshold: <tspan fill="#4ade80" font-family="monospace">distance &lt; 0.60 (tuned 0.40)</tspan></text>
        <text x="18" y="138" fill="#cbd5e1" font-size="12">Preprocessing: <tspan fill="#ffffff">OpenCV BGR2RGB + Scaling</tspan></text>
        <text x="18" y="164" fill="#cbd5e1" font-size="12">Target Problem: <tspan fill="#fbbf24">50GB Robotics Album Curation</tspan></text>
        <text x="18" y="190" fill="#34d399" font-size="11">✓ Zero cloud upload · Fully local execution</text>
      </g>
    </g>
  </g>
</svg>
